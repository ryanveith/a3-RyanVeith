    <main>

          <input class="pure-u-1 pure-u-md-1-3" type='text' id='username' value=''placeholder='enter your username'>
          <input class="pure-u-1 pure-u-md-1-3" type='password' id='password' value='' placeholder='enter your password here'>

      </form>
