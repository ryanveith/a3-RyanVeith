<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='/home.js'></script>
    <link rel='stylesheet' href='main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <header>
      <button type="button" onclick="logout()"> Log Out</button>
    </header>
    
    <form>
      <p>
        Welcome back "username"!
      </p>
      <ul>
      <legend>What would you like to do</legend>
        <li>
          <label>
            <input id = "whatToDo1" name="whatToDo" value="1" type = "radio">
            Change Username 
          </label>
        </li>
        <li>
          <label>
            <input id = "whatToDo2" name="whatToDo" value="2" type = "radio">
            Change Password
          </label>
        </li>
        <li>
          <label>
            <input id = "whatToDo3" name="whatToDo" value="3" type = "radio">
            Change Profile picture
          </label>
        </li>
        <li>
          <label>
            <input id = "whatToDo4" name="whatToDo" value="4" type = "radio">
            Modify scroes for games
          </label>
        </li>
      </ul>
      <button> Get Started</button>
    </form>

    <div id="layout">
      <form class="item">
        <select id='option'>
          <option>Add Score</option>
          <option>Modify Score</option>
          <option>Delete Score</option>
        </select>
        <input type='text' id='username' value=''placeholder='enter your username'>
        <input type='text' id='highscore' value='' placeholder='enter your score here'>
        <button type="button" onclick="customSubmit()" >submit</button>
      </form>

      <section class="item">
        <h2 >Highscores</h2>
        <ul id = 'scoretable'>
          <li>
            Submit a Score to see how how it compares to other highscores
          </li>
        </ul>
      </section>
    </div>
  </body>
</html>
